name: Azure NC/ND GPU Virtual Machines
description: Microsoft Azure GPU-accelerated virtual machines including NCads
  H100 v5, ND H100 v5, NC A100 v4, and NVads A10 v5 series. Offers InfiniBand
  networking options and is well-suited for Windows/Linux workstations and Azure
  ML training jobs.
