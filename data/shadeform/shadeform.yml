markdown: >-
  ## Overview


  Shadeform is a GPU cloud marketplace that aggregates GPU capacity across 30+
  cloud providers through a single console, API, and bill.


  ## Features


  - Access to 30+ cloud providers

  - Unified console and API

  - Single bill across multiple providers

  - GPU capacity search and deployment


  ## Pricing


  Paid. Pricing varies by underlying provider and GPU type.
