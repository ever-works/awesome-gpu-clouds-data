name: Oracle Cloud Infrastructure GPU
description: Oracle Cloud GPU instances including bare-metal and VM options with
  NVIDIA H100, H200, A100, L40S, and AMD MI300X GPUs. Features RDMA cluster
  networking and is often priced below AWS/GCP/Azure for equivalent shapes, with
  free egress tiers.
