markdown: >-
  ## Overview


  Weights & Biases is an MLOps platform for experiment tracking, model registry,
  and performance monitoring for GPU training runs.


  ## Features


  - Experiment tracking for ML training

  - Model registry and versioning

  - Performance monitoring and visualization

  - GPU training run tracking

  - Hyperparameter optimization

  - Collaboration tools for ML teams


  ## Pricing


  Paid. Free tier available for individuals; team and enterprise plans with
  usage-based pricing.
