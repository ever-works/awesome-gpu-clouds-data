markdown: >-
  ## Overview


  Docker Hub is a public container registry hosting official GPU-enabled images
  for CUDA, PyTorch, TensorFlow, and community ML projects.


  ## Features


  - Official GPU-enabled images for CUDA, PyTorch, TensorFlow

  - Community ML project images

  - Public and private repositories

  - Automated builds and webhooks

  - Docker CLI integration


  ## Pricing


  Free for public repositories; paid plans for private repositories and
  additional features.
