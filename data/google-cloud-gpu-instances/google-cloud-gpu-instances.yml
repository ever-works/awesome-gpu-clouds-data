name: Google Cloud GPU Instances
description: Google Cloud Platform GPU-accelerated virtual machine instances
  including A3 (H100), A3 Ultra (H200), A4 (B200), A4X (GB200), G2 (L4), and G4
  (RTX PRO 6000) machine types. Tightly integrated with Vertex AI, GKE, and TPUs
  for AI training and inference workloads.
