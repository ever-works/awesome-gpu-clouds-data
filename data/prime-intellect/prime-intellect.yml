markdown: >-
  ## Overview


  Prime Intellect is a decentralized compute exchange that aggregates GPU
  capacity from 12+ providers for distributed training and inference workloads.


  ## Features


  - Aggregates 12+ GPU cloud providers

  - Distributed training and inference support

  - Compute exchange marketplace

  - Unified access to multi-provider GPU capacity


  ## Pricing


  Paid. Pricing varies by underlying provider and GPU configuration.
