markdown: >-
  ## Overview


  NVIDIA DGX Cloud Lepton is a compute marketplace connecting developers to tens
  of thousands of GPUs across global NVIDIA Cloud Partners.


  ## Features


  - Access to tens of thousands of GPUs

  - Global NVIDIA Cloud Partners network

  - Compute marketplace for distributed GPU capacity

  - AI training and inference workloads

  - DGX Cloud integration


  ## Pricing


  Paid. Pricing varies by underlying cloud partner and GPU type.
