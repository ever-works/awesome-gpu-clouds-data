  ## Overview


  GitHub Container Registry is a container and artifact hosting service tightly
  integrated with GitHub Actions and repositories.


  ## Features


  - Container and artifact hosting

  - Integrated with GitHub Actions

  - Package versioning and management

  - Private and public container repositories

  - Fine-grained access control


  ## Pricing


  Free for public repositories and packages; paid for private package storage
  beyond free allowances.
