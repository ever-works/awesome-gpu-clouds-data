markdown: >-
  ## Overview


  Baseten is a model-serving platform for deploying machine learning models with
  low-latency inference and async workers.


  ## Features


  - Low-latency model inference

  - Async workers for background processing

  - Truss: open-source model packaging framework

  - GPU-accelerated inference endpoints


  ## Pricing


  Paid. Pricing varies by usage and model deployment configuration.
