markdown: >-
  ## Overview


  NVIDIA Run:ai is a Kubernetes-native GPU orchestration and workload scheduler
  designed to maximize AI compute utilization.


  ## Features


  - Kubernetes-native GPU orchestration

  - Workload scheduling for AI training and inference

  - GPU resource allocation and fragmentation management

  - Multi-cluster and multi-tenant support

  - Integration with NVIDIA AI Enterprise


  ## Pricing


  Paid. Enterprise pricing based on cluster size and deployment scope.
