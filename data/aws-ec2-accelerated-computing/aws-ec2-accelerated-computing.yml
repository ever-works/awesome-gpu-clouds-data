name: AWS EC2 Accelerated Computing
description: Amazon Web Services EC2 instance types for GPU-accelerated
  computing including P5/P5e (H100/H200), P4d (A100), G6e (L40S), and
  Trainium/Inferentia accelerators. Offers EFA networking and UltraClusters for
  large-scale distributed training. Pricing models include on-demand, spot,
  reserved, and capacity blocks.
