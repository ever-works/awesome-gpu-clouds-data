company_name: Awesome GPU Clouds
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome GPU Clouds
initial_prompt: |-
  A curated directory of GPU clouds, GPU marketplaces and serverless GPU providers for AI training and inference. Include products such as RunPod, Lambda, CoreWeave, Vast.ai, Nebius, Together AI, Modal, Crusoe, Hyperbolic, TensorDock, Voltage Park, Fluidstack, plus other notable commercial and open-source options. Categories: Specialized GPU Clouds, Hyperscalers, GPU Marketplaces, Serverless GPU, Bare-Metal & Reserved Clusters, Price Comparison Tools. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Specialized GPU Clouds; Hyperscalers; GPU Marketplaces; Serverless GPU; Bare-Metal & Reserved Clusters; Price Comparison Tools.
  Target keywords: gpu cloud, cloud gpu, rent gpu, serverless gpu, h100 cloud.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://getdeploying.com/reference/cloud-gpu
  - https://cloud-gpus.com/
  - https://raw.githubusercontent.com/Enterprise-AI-Atlas/awesome-gpu-cloud/HEAD/README.md
  - https://github.com/topics/gpu-cloud

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
